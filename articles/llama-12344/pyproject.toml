[project]

name = "llama"
dynamic = ["version"]
requires-python = ">=3.12"

#-------------------------------------------------------------------------------
# Dependencies
#-------------------------------------------------------------------------------

dependencies = [
    "blobfile>=3.0.0",
    "fairscale>=0.4.13",
    "ipykernel>=6.29.5",
    "ipywidgets>=8.1.5",
    "llama-models>=0.0.49",
    "matplotlib>=3.9.2",
    "pandas>=2.2.3",
    "requests>=2.32.3",
    "rich>=13.9.4",
    "seaborn>=0.13.2",
    "torch>=2.5.1",
    "tqdm>=4.67.0",
]

#-------------------------------------------------------------------------------
# Build System
#-------------------------------------------------------------------------------

[build-system]

requires = ["hatchling"]
build-backend = "hatchling.build"

#-------------------------------------------------------------------------------
# Build Backend
#-------------------------------------------------------------------------------

[tool.hatch.version]

source = "env"
variable = "PY_VERSION"

#-------------------------------------------------------------------------------
# Dev Dependencies
#-------------------------------------------------------------------------------

[tool.uv]

dev-dependencies = [
    "pytest-cov>=6.0.0",
    "pytest-xdist>=3.6.1",
    "pytest>=8.3.3",
    "python-dotenv>=1.0.1",
]

