#-------------------------------------------------------------------------------
# Project: stickshift
#-------------------------------------------------------------------------------

[project]

name = "stickshift"
dynamic = ["version"]
requires-python = ">=3.12"

dependencies = [
    "beautifulsoup4>=4.12.3",
    "bibtexparser>=2.0.0b8",
    "click>=8.1.7",
    "jinja2>=3.1.4",
    "jupytext>=1.16.4",
    "markdown-it-py>=3.0.0",
    "mdit-py-plugins>=0.4.2",
    "nbclient>=0.10.1",
    "nbconvert>=7.16.4",
    "nbformat>=5.10.4",
    "pydantic>=2.10.3",
    "pygments>=2.18.0",
    "pyyaml>=6.0.2",
]

#-------------------------------------------------------------------------------
# Build System
#-------------------------------------------------------------------------------

[build-system]

requires = ["hatchling"]
build-backend = "hatchling.build"

#-------------------------------------------------------------------------------
# Build Backend
#-------------------------------------------------------------------------------

[tool.hatch.version]

source = "env"
variable = "PY_VERSION"

#-------------------------------------------------------------------------------
# uv
#-------------------------------------------------------------------------------

[tool.uv]

dev-dependencies = [
    "ipykernel>=6.29.5",
    "jupyterlab-myst>=2.4.2",
    "jupyterlab>=4.3.2",
    "jupytext>=1.16.4",
    "matplotlib>=3.9.3",
    "numpy>=2.1.3",
    "pillow>=11.0.0",
    "pytest-cov>=6.0.0",
    "pytest-xdist>=3.6.1",
    "pytest>=8.3.3",
    "python-dotenv>=1.0.1",
]

